# MoerEngine configuration
# Generated by tools/config/generate.py; edit tools/config/schema.json.
# Renderer enum values use the case-sensitive names listed beside each field.
# Defaults < low_quality_mode preset < explicit renderer fields; enable_shadow=false wins.
# Renderer fields below are commented optional overrides; uncomment only the values you need.

[editor]
width = 1920
height = 1080
fullscreen = false
vsync = false
lock_frame_rate = false
fps = 60
max_fps = 170
font_size = 17.0
preset_imgui_config_path = "./asset/preset_imgui.ini"

[engine]

[engine.threading]
render_thread = false
profile_logging = false
# Bounded RHI overlap. Runtime clamps to [1, 8]; aliased native queues use 1.
submission_batch_window = 2
max_frame_lag = 0

[engine.profile_dump]
# Start an Engine-owned capture session at startup; it can be stopped and restarted.
enabled = false
output_path = "./profile/MoerProfile.mpd"
# Replace the previous final capture only after the new capture closes successfully.
replace_existing = true

[engine.rhi]
# Supported backend names include Vulkan and D3D12.
type = "Vulkan"
api_version = "1.3"
max_frame_in_flight = 3

[engine.render]
# Raster or Raytracing.
default_render_method = "Raster"

[engine.render.raster]
# RDG compilation is mandatory; parallel recording changes CPU scheduling only.
enable_shadow = true
# Use SSAO, fewer/smaller CSM cascades and simplified FXAA on lower-end GPUs.
low_quality_mode = false
render_graph_debug_dump = false
render_graph_parallel_recording = false
