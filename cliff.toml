[changelog]
header = """
# 更新日志

根据 Git 提交生成，发布说明可在生成后补充整理。

"""
body = """
{% if version -%}
## [{{ version }}](https://github.com/NJUCG/MoerEngine/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## 未发布
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}**不兼容变更** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=8, end="") }}](https://github.com/NJUCG/MoerEngine/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
{% if previous.version -%}
[完整差异](https://github.com/NJUCG/MoerEngine/compare/{{ previous.version }}...{% if version %}{{ version }}{% else %}HEAD{% endif %})
{% endif %}
"""
trim = true
footer = "\n<!-- generated by git-cliff -->\n"

[git]
conventional_commits = true
# Older engine commits use both Chinese descriptions and plain English subjects.
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^Merge ", skip = true },
    { message = "(?i)^(feat|add|implement|support)", group = "新增功能" },
    { message = "(?i)^fix", group = "问题修复" },
    { message = "(?i)^perf", group = "性能优化" },
    { message = "(?i)^refactor", group = "代码重构" },
    { message = "(?i)^(docs|document)", group = "文档" },
    { message = "(?i)^test", group = "测试" },
    { message = "(?i)^(build|ci|deps)", group = "构建与依赖" },
    { message = ".*", group = "其他变更" },
]
filter_commits = false
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
topo_order = true
sort_commits = "oldest"
